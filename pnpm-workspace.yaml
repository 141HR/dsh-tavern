packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
# 分阶段安装会把 node_modules 随目录改名，pnpm 据旧绝对路径判定需重建；安装器无人应答，不能询问。
confirmModulesPurge: false
# Desktop 2.0.13 自带 pnpm 11.8.0。经 Electron 加载时，缺失的默认 .pnpmfile.mjs 会让安装失败。
ignorePnpmfile: true
allowBuilds:
  node-pty: false
minimumReleaseAgeExclude:
  - dsh-better-sidebar@0.26.0
  - dsh-mnemon-source-runtime@0.5.14
  - dsh-mnemon-strategy-default-three-tier@0.5.8
  - dsh-mnemon@0.5.29
patchedDependencies:
  dsh-better-sidebar@0.26.0: patches/dsh-better-sidebar@0.26.0.patch
  dsh-pocket@2.11.0: patches/dsh-pocket@2.11.0.patch
  dsh-web-mobile@3.1.0: patches/dsh-web-mobile@3.1.0.patch
