name: Publish npm package

# 插件版（桌面版「添加插件」/ `dsh plugin add dsh-profile-tavern`）只从 npm 安装和更新。
# 推送 v* 标签即发布，包内版本号取自标签（v3.1 → 3.1.0，v3.1.1 → 3.1.1），
# 仓库里的 package.json 不必先改。也可以手动运行并填写版本号。
# 用 npm Trusted Publishing（OIDC）发布，不需要 NPM_TOKEN：在 npm 包设置里把
# GitHub 仓库 flizzywine/dsh-tavern、工作流 publish-npm.yml 登记为可信发布者。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'npm 版本号，例如 3.1.2'
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1+.
      - run: npm install -g npm@11.6.2
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          raw="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ "$raw" =~ ^[0-9]+\.[0-9]+$ ]]; then raw="$raw.0"; fi
          if ! [[ "$raw" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "不是有效版本号：$raw" >&2; exit 1
          fi
          echo "value=$raw" >> "$GITHUB_OUTPUT"
      - name: Skip if already published
        id: existing
        shell: bash
        run: |
          if npm view "dsh-profile-tavern@${{ steps.version.outputs.value }}" version >/dev/null 2>&1; then
            echo "dsh-profile-tavern@${{ steps.version.outputs.value }} 已在 npm 上，跳过。"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.existing.outputs.published != 'true'
        shell: bash
        run: |
          npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
          npm publish --access public
