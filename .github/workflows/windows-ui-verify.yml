name: Windows UI Verify

# Pre-release check on a clean Windows: silent-install official DeepSeek Harness, get past its
# welcome page with the DEEPSEEK_API_KEY secret, run install.ps1 the README way (it installs
# the published main), relaunch and screenshot over CDP. Screenshots are the artifact.
on:
  workflow_dispatch:

env:
  DESKTOP_SETUP_URL: https://download.deepseek.com/dsh-desk/bin/win-x64/deepseek-harness-0.2.1-rc.2-win-x64.exe
  DESKTOP_SETUP_SHA256: 72e4a8579f11b5428dd0a1506532777924adba7ecaacc710a7e429085796537f

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download and silent install
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'harness.exe'
          curl.exe --fail --location --retry 3 --silent --show-error --output $setup $env:DESKTOP_SETUP_URL
          $actual = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:DESKTOP_SETUP_SHA256) { throw "SHA-256 mismatch: $actual" }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          Write-Output "installer exit $($p.ExitCode) in $($sw.Elapsed.TotalSeconds)s"
          Get-ChildItem "$env:LOCALAPPDATA\Programs" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem $env:ProgramFiles | Where-Object Name -like '*Harness*' | Select-Object FullName
          Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like '*Harness*' | Format-List DisplayName,DisplayVersion,InstallLocation,UninstallString

      - name: Launch and get past the welcome page
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\DeepSeek Harness\DeepSeek Harness.exe"
          "EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Start-Process -FilePath $exe -ArgumentList '--remote-debugging-port=9222'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/version | Out-Null; break } catch {} }
          Start-Sleep 15
          node packaging/windows/ui-verify.mjs welcome "$env:RUNNER_TEMP\shots" first
          node packaging/windows/ui-verify.mjs shot "$env:RUNNER_TEMP\shots" first
          Get-Process | Where-Object { $_.Path -like '*Harness*' } | Stop-Process -Force
          Start-Sleep 5

      - name: Run install.ps1 (desktop)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          # Same as the README command: decode as UTF-8, then Invoke-Expression.
          $env:DSH_TAVERN_HOST = 'desktop'
          $script = [IO.File]::ReadAllText((Resolve-Path ./install.ps1), [Text.Encoding]::UTF8)
          try { Invoke-Expression $script *>&1 | Tee-Object "$env:RUNNER_TEMP\shots\install.log"; Write-Output "install OK in $($sw.Elapsed.TotalSeconds)s" }
          catch { Write-Output "install FAILED in $($sw.Elapsed.TotalSeconds)s: $_"; throw }

      - name: Relaunch and screenshot
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          Start-Process -FilePath $env:EXE -ArgumentList '--remote-debugging-port=9222'
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:9222/json/version | Out-Null; break } catch {} }
          Start-Sleep 30
          node packaging/windows/ui-verify.mjs welcome "$env:RUNNER_TEMP\shots" after
          node packaging/windows/ui-verify.mjs shot "$env:RUNNER_TEMP\shots" after

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-ui-verify
          path: ${{ runner.temp }}/shots
          retention-days: 3
